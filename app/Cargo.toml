[package]
name = "jobfinder"
version = "0.1.3"
edition = "2024"
description = "JobFinder: Recruiter's CV match as a local desktop app"
license = "BSD-2-Clause"
publish = false

# xtask/ holds the developer commands (`cargo dev`). It shares this Cargo.lock and target/, and
# plain `cargo build`, `cargo test` and `cargo run` still mean the app.
[workspace]
members = ["xtask", "device-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Word lists keep the index's order, which decides ties and typo candidates.
indexmap = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"
# The app's SQLite (built in, so the exe needs no sqlite3.dll), with queries checked at compile
# time against the .sqlx cache.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
] }
dirs = "6"
# Lookaround in some patterns (Apply_instructions), which the regex crate lacks.
fancy-regex = "0.20"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process", "time", "fs", "io-util"] }
# The page's CSS and JS, read from ../assets while developing and built into the exe for release.
rust-embed = { version = "8", features = ["include-exclude"] }
chrono = "0.4"
webbrowser = "1"
pdf-writer = "0.15"
subsetter = "0.2"
ttf-parser = "0.25"
miniz_oxide = "0.9"
# A PDF's text (pdf_text): an uploaded CV, a PDF job post.
pdf-extract = "0.12"
# The secrets kept in Windows Credential Manager (the keyring elsewhere) before the secrets
# table, read once to move them into it (account::former_keys).
keyring = "4"
# The secrets table's values, sealed under the database's data key (account::data_key), and that
# key's bytes wiped from memory once dropped.
chacha20poly1305 = "0.10"
zeroize = "1"
# The language models' APIs over HTTPS (rustls, with Windows' own certificate store), through
# the system's proxy when one is set; job post pages (Page_reader), compressed as servers send them.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy", "gzip", "brotli", "deflate"] }
# Job posts fetched from a pasted link (Page_reader): the page's HTML as a tree, its entities
# and the encodings older sites still send.
scraper = "0.29"
ego-tree = "0.11"
url = "2"
html-escape = "0.3"
encoding_rs = "0.8"
# A found job post's url_hash (job_scan), sha1 of its normalised url as recruiter keeps it.
sha1 = "0.10"
# The shipped taxonomy index's sha256, which says when to write it into the database again.
sha2 = "0.10"
# The app updater compares release versions and stages downloads beside the running program.
semver = "1"
tempfile = "3"
# The llama.cpp release the setup wizard downloads, unzipped into the llama folder.
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
# Laya on ONNX Runtime, run in this process (ONNX Runtime linked in statically).
laya-server = { path = "../laya-server" }
# JobFinder's signed-in browser (job_sites::cdp): its DevTools on 127.0.0.1, over a WebSocket.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# What the app and its paired devices (a phone, a tablet) send each other (devices).
device-protocol = { path = "device-protocol" }
# Pairing codes and device tokens, from the system's random source.
getrandom = "0.3"
# The desktop window (desktop/), pinned: its releases come about yearly and change the API.
iced = { version = "=0.14.0", features = ["qr_code", "canvas", "svg"] }
# A recording's sound (recordings::audio): the phone's call recordings (m4a/AAC), mp3, wav, flac
# and ogg, decoded for whisper.cpp. Pure Rust, so no codec library to build or ship.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }
# The window's Open file dialog: Windows' own, and the desktop portal on Linux (no GTK to build).
rfd = "0.17"

# The memory and graphics card a llama.cpp model is weighed against (DXGI), the data key's DPAPI
# wrapping (account::data_key), the job object
# that ends llama-server with the app, whether the installer has its console to itself, and
# whether a game runs (game_mode: the registry, and the window in front); Windows' own
# notifications (notifications: toasts, and the app's name for them in the registry).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Whether Feral's gamemode runs a game (game_mode), on the session D-Bus; the window's theme
# detection already builds it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"

[lints.clippy]
# A future this big, awaited inside another, makes the debug build's poll frames add up past a
# tokio worker's stack (Start scan overflowed it): box it (Box::pin) where it is awaited. The
# threshold is in clippy.toml.
large_futures = "warn"
